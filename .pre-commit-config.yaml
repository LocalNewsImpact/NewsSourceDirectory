repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^mockup/
      - id: trailing-whitespace
        exclude: ^mockup/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # The mockup carries the full dataset inline and is intentionally large.
        args: [--maxkb=2048]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # This repository's interpreter, not whatever `python` PATH
        # happens to resolve to. With another checkout's venv active it
        # found no Django and failed the commit with eleven import
        # errors that had nothing to do with the change being made --
        # the same fault as a CI stage that runs something other than
        # what a person runs.
        entry: .venv/bin/python -m pytest
        language: system
        pass_filenames: false
        types: [python]
