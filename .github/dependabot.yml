# One pull request per ecosystem, not one per package.
#
# The first run of this file produced twelve pull requests, because only Django
# was grouped. Twelve PRs is twelve CI runs, twelve approvals and twelve merges
# to move about forty lines. Every ecosystem now has a catch-all group, and they
# share one schedule, so a month's updates arrive together and are tested once.
#
# Security advisories are exempt from grouping by design and will still arrive on
# their own. That is the behaviour worth keeping.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      javascript:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      images:
        patterns: ["*"]
    labels: [dependencies]
