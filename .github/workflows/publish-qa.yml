# Publish the registry to GitHub Pages for review.
#
# Pages rather than a bucket, deliberately: every publish is a commit, so a
# reviewer can see *what changed* between one and the next — "this publish moved
# four outlets" — and a bad one is revertable. For a hand-curated registry that
# is worth more than the few pennies a bucket would cost.
#
# The runner reads the database directly through the Cloud SQL proxy as a
# read-only role. It cannot write to the registry even if this workflow is
# wrong.

name: Publish QA feed

on:
  # An editor pressing "Publish now" in the admin. The useful trigger: curation
  # happens in the database, which produces no git event of its own.
  repository_dispatch:
    types: [publish-feed]

  # After a deploy, because a schema or projection change alters what the feed
  # contains even when no one has edited anything.
  workflow_run:
    workflows: [Deploy]
    types: [completed]

  # The safety net beneath both, for a signal that never arrived.
  schedule:
    - cron: "0 11 * * *"      # 06:00 Central, before anyone starts editing

  workflow_dispatch:
    inputs:
      allow_errors:
        description: "Publish despite data-quality errors"
        type: boolean
        default: true

concurrency:
  group: publish-qa
  cancel-in-progress: false

permissions:
  contents: write             # to commit the feed
  id-token: write             # to mint the WIF token

env:
  PROJECT_ID: lnic-source-directory
  SQL_INSTANCE: mizzou-news-crawler:us-central1:mizzou-db-prod

jobs:
  publish:
    name: Build and commit the feed
    runs-on: ubuntu-latest
    # A failed deploy leaves the service on the previous revision, so publishing
    # from it would describe a version that is not serving.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/666766099662/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@lnic-source-directory.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Start the Cloud SQL proxy
        run: |
          curl -sL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$SQL_INSTANCE" &
          for _ in $(seq 1 30); do nc -z 127.0.0.1 5432 && break; sleep 1; done

      - name: Build the feed
        env:
          # A read-only role. The workflow cannot alter the registry.
          DATABASE_URL: postgres://directory_ro:${{ secrets.DB_RO_PASSWORD }}@127.0.0.1:5432/directory
          DJANGO_SECRET_KEY: publish-only
        run: |
          FLAGS=""
          if [ "${{ inputs.allow_errors || 'true' }}" = "true" ]; then
            FLAGS="--allow-errors"
          fi
          python manage.py publish --out data $FLAGS

      - name: Publish to the gh-pages branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A separate branch rather than main. main is protected — a pull
          # request is required and nothing may bypass it — and a bot cannot
          # open and approve its own. Publishing here keeps that protection
          # intact while still giving every publish a commit and a diff.
          SITE="$(mktemp -d)"
          git worktree add "$SITE" --detach

          cd "$SITE"
          git checkout --orphan gh-pages-new
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +

          # What Pages serves: the QA page and the feed it reads.
          cp -r "$GITHUB_WORKSPACE/mockup" ./mockup
          cp -r "$GITHUB_WORKSPACE/data"   ./data
          cp "$GITHUB_WORKSPACE/index.html" ./index.html 2>/dev/null || true
          touch .nojekyll

          git add -A
          git commit -q -m "Publish feed $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"

          # Fast-forward is impossible against an orphan, so the branch is
          # replaced. Its history is a log of publishes, not of the project.
          git push -f origin HEAD:gh-pages
          echo "published to gh-pages"
