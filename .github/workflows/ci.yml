name: CI

on:
  push:            # every branch, so a contributor sees failures before opening a PR
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned ruff
        run: pip install "$(grep -oE '^ruff==[0-9.]+' requirements-dev.txt)"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned pytest
        run: pip install "$(grep -oE '^pytest==[0-9.]+' requirements-dev.txt)"
      - name: Unit tests
        run: python -m pytest -m "not integration"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: directory
          POSTGRES_PASSWORD: directory
          POSTGRES_DB: directory
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U directory -d directory"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://directory:directory@localhost:5434/directory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned pytest
        run: pip install "$(grep -oE '^pytest==[0-9.]+' requirements-dev.txt)" "psycopg[binary]>=3.2"
      - name: Integration tests
        run: python -m pytest -m integration

  data-quality:
    name: Data quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The fixture is real prototype data and still carries its defects, so it
      # is expected to FAIL. This job asserts the rules still catch them —
      # a clean run here would mean the checks have stopped working.
      - name: Rules detect the known defects
        run: |
          set +e
          python -m checks tests/fixtures/outlets_sample.csv \
            --coverage tests/fixtures/coverage_sample.csv | tee report.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Fixture passed all rules — the defect detection has regressed."
            exit 1
          fi
          for rule in no_placeholder_domain merge_requires_review no_header_artifacts no_url_in_medium; do
            grep -q "$rule" report.txt || { echo "::error::$rule no longer fires"; exit 1; }
          done
          echo "All expected defects detected."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: report.txt

  feed:
    name: Public feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: Build the feed from the fixture
        run: |
          python -m feed tests/fixtures/outlets_sample.csv \
            --coverage tests/fixtures/coverage_sample.csv \
            --out dist/feed --generated-at 2026-01-01T00:00:00Z --allow-errors
          cat dist/feed/manifest.json
      - name: Feed carries no admin columns
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from checks.rules import PUBLIC_FIELDS
          from checks.rules import COVERAGE_PUBLIC_FIELDS
          base = pathlib.Path("dist/feed")
          m = json.loads((base / "manifest.json").read_text())

          rows = json.loads((base / m["files"]["sites"]["path"]).read_text())
          extra = sorted({k for r in rows for k in r} - PUBLIC_FIELDS)
          if extra:
              print(f"::error::sites feed carries non-public columns: {extra}")
              raise SystemExit(1)
          print(f"sites: {len(rows)} rows, fields all allowlisted")

          cov_meta = m["files"].get("coverage")
          if not cov_meta:
              print("::error::coverage feed was not published")
              raise SystemExit(1)
          cov = json.loads((base / cov_meta["path"]).read_text())
          extra = sorted({k for r in cov for k in r} - COVERAGE_PUBLIC_FIELDS)
          if extra:
              print(f"::error::coverage feed carries non-public columns: {extra}")
              raise SystemExit(1)
          print(f"coverage: {len(cov)} rows, fields all allowlisted")

          if m["files"]["sites"]["load"] != "eager" or cov_meta["load"] != "lazy":
              print("::error::load hints wrong; sites must be eager and coverage lazy")
              raise SystemExit(1)

          known = {r["outlet_id"] for r in rows}
          orphans = {r["outlet_id"] for r in cov} - known
          if orphans:
              print(f"::error::coverage rows with no published outlet: {sorted(orphans)[:5]}")
              raise SystemExit(1)
          print("coverage joins cleanly to sites on outlet_id")
          PY
      - name: Search index builds against the same feed
        run: node tools/build-search-index.mjs dist/feed
      - name: Feed build is reproducible
        run: |
          cp dist/feed/manifest.json /tmp/first.json
          rm -rf dist
          python -m feed tests/fixtures/outlets_sample.csv \
            --coverage tests/fixtures/coverage_sample.csv \
            --out dist/feed --generated-at 2026-01-01T00:00:00Z --allow-errors
          python - <<'PY'
          import json, pathlib
          a = json.loads(pathlib.Path("/tmp/first.json").read_text())
          b = json.loads(pathlib.Path("dist/feed/manifest.json").read_text())
          if a["files"]["sites"]["sha256"] != b["files"]["sites"]["sha256"]:
              print("::error::feed build is not reproducible")
              raise SystemExit(1)
          print("reproducible:", b["files"]["sites"]["sha256"][:12])
          PY

  pages:
    name: Pages payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mockup stays servable
        run: |
          test -f mockup/index.html
          test -f .nojekyll
          size=$(wc -c < mockup/index.html)
          echo "mockup/index.html: $size bytes"
          # GitHub Pages serves up to 100MB per file; stay well inside it.
          if [ "$size" -gt 20000000 ]; then
            echo "::error::mockup exceeds 20MB"; exit 1
          fi
      - name: Internal doc links resolve
        run: |
          fail=0
          for f in README.md MIGRATION.md; do
            grep -oE '\]\([^)#][^)]*\)' "$f" | sed 's/^](//;s/)$//' \
              | grep -vE '^https?://' | while read -r link; do
                  target="${link%%#*}"
                  [ -z "$target" ] && continue
                  if [ ! -e "$target" ]; then
                    echo "::error file=$f::broken link: $target"; exit 1
                  fi
                done || fail=1
          done
          exit $fail
