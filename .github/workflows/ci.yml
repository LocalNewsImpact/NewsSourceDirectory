# The suite's CI, called rather than restated.
#
# This repository defined eight jobs, each inlining its own commands --
# ruff here, pytest there, and four stages that existed only as shell
# inside this file and could not be run on a laptop at all. The crawler
# and datadesk each had their own arrangement of the same ideas, so a
# rule learned in one stayed there.
#
# Now every stage is a make target. The first four come from
# lnic-contracts (docs/shared-ci.md), which owns their order, the
# Postgres service and the Python version; the rest are this
# repository's own, because a public feed and a deployment image are not
# things the other repositories have. They are jobs here, but they run
# `make`, so each is runnable by a person before they push.
#
# `conforms` fails the build if this drifts back to inline stages.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: LocalNewsImpact/lnic-contracts/.github/workflows/python-checks.yml@ci-v1
    with:
      install: make .venv
      # mypy is not wired up here yet; ruff runs inside `make lint`.
      typecheck: false
      integration: true
      # tests/test_release.py asserts pyproject's version is not one
      # already released. Without the tags it found none, took its
      # "nothing to check" path and passed -- so main sat at 0.4.0 with
      # v0.4.0 tagged, green. The test now fails in CI if the tags are
      # missing, so this flag cannot be quietly dropped again.
      fetch-tags: true

  conforms:
    uses: LocalNewsImpact/lnic-contracts/.github/workflows/conforms.yml@ci-v1
    with:
      typecheck: false
      integration: true

  # --- this repository's own stages ------------------------------------
  #
  # Not in the shared workflow, because no other repository publishes a
  # feed or builds this image. Each is one make target, so the check and
  # the local command cannot differ.

  data-quality:
    name: Data quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make .venv
      - run: make data-quality

  feed:
    name: Public feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make .venv
      - run: make feed-check

  pages:
    name: Pages payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make pages

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
