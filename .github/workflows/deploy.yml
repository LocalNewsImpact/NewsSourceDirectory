# Runs only on main, after CI has passed and a reviewer has approved — branch
# protection guarantees both, so this workflow does not re-check them.
#
# Until the Django app exists there is nothing to build. Rather than sit dormant
# and rot, the workflow authenticates to GCP on every run, which proves the
# Workload Identity Federation binding still works. The build and deploy steps
# switch themselves on the day a Dockerfile appears.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main          # never two deploys at once
  cancel-in-progress: false   # let a running deploy finish

permissions:
  contents: read
  id-token: write             # required to mint the WIF token

env:
  PROJECT_ID: lnic-source-directory
  REGION: us-central1
  SERVICE: sources-admin
  REPO: app
  # Cloud Run reaches Cloud SQL over a unix socket rather than a host and port,
  # so the service is given the connection name and assembles the DSN itself.
  # Passing a DATABASE_URL here would point the deployed service at its own
  # localhost — see config/db.py.
  SQL_INSTANCE: mizzou-news-crawler:us-central1:mizzou-db-prod
  ADMIN_HOST: sources.localnewsimpact.org

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there anything to deploy yet?
        id: app
        run: |
          if [ -f Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet — authenticating only. See DEVELOPMENT.md M2."
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/666766099662/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@lnic-source-directory.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Confirm the deploy identity
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo "project: ${PROJECT_ID}"

      - name: Build and push the image
        if: steps.app.outputs.ready == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # One job, not two. Each `jobs deploy` costs 60-90s even when nothing
      # changed, and running migrate and configure_site separately spent about
      # four and a half minutes of every deploy on the same overhead twice.
      #
      # Migrations run before traffic shifts, never as a side effect of the
      # service starting — two revisions racing to migrate is a bad night.
      - name: Migrate and configure the site
        if: steps.app.outputs.ready == 'true'
        run: |
          gcloud run jobs deploy "${SERVICE}-release" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" \
            --command /bin/sh \
            --args "^|^-c|python manage.py migrate --noinput && python manage.py configure_site --domain $ADMIN_HOST" \
            --set-secrets DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest \
            --set-env-vars "CLOUD_SQL_CONNECTION_NAME=$SQL_INSTANCE,DB_NAME=directory,DB_USER=directory" \
            --set-cloudsql-instances $SQL_INSTANCE \
            --service-account directory-run@lnic-source-directory.iam.gserviceaccount.com
          gcloud run jobs execute "${SERVICE}-release" \
            --region "$REGION" --project "$PROJECT_ID" --wait

      - name: Deploy the service
        if: steps.app.outputs.ready == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" \
            --service-account directory-run@lnic-source-directory.iam.gserviceaccount.com \
            --set-secrets "DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest" \
            --set-env-vars "^@^CLOUD_SQL_CONNECTION_NAME=$SQL_INSTANCE@DB_NAME=directory@DB_USER=directory@ADMIN_HOST=$ADMIN_HOST@DJANGO_ALLOWED_HOSTS=$ADMIN_HOST,.run.app@DJANGO_CSRF_TRUSTED_ORIGINS=https://$ADMIN_HOST" \
            --set-cloudsql-instances $SQL_INSTANCE \
            --ingress all --allow-unauthenticated --min-instances 0

      # gcloud reports a failed IAM binding as a warning and still exits zero, so
      # a deploy can report success while leaving the service unreachable. That
      # is what the first real deploy did: the org's Domain Restricted Sharing
      # policy refused the public invoker binding, and every request was rejected
      # with 403 before it reached Django.
      - name: The service is reachable
        if: steps.app.outputs.ready == 'true'
        run: |
          policy="$(gcloud run services get-iam-policy "$SERVICE" \
                     --region "$REGION" --project "$PROJECT_ID" --format=json)"
          if ! echo "$policy" | grep -q 'run.invoker'; then
            echo "::error::No invoker binding — deployed but nobody can reach it."
            echo "Domain Restricted Sharing blocks this unless the project has an exception."
            echo "See infra/README.md, 'Public ingress'."
            exit 1
          fi
          echo "invoker binding present"

      - name: Smoke test
        if: steps.app.outputs.ready == 'true'
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" \
                  --project "$PROJECT_ID" --format='value(status.url)')"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$URL/_health")"
          echo "$URL/_health -> $code"
          [ "$code" = "200" ] || { echo "::error::smoke test failed"; exit 1; }
