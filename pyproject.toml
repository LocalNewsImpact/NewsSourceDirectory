[project]
name = "news-source-directory"
version = "0.1.0"
description = "Registry of local news outlets for the Local News Impact Consortium"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Draft models are not wired into a Django project yet.
"schema/models_draft.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
