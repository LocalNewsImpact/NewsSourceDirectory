<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}News Source Directory{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
  /* Tokens taken from localnewsimpact.org, so the admin reads as part of the
     same site rather than as a Django install that happens to be on the
     domain. Divi accent #66cef6, link #0073aa, Montserrat and Lato. */
  :root {
    --ink: #1c2a31; --muted: #5b6b74; --rule: #dfe5e8;
    --link: #0073aa; --link-hover: #005177; --accent: #66cef6;
    --accent-wash: #e8f7fe; --ground: #ffffff; --ground-soft: #f4fafd;
    --head: 'Montserrat', Helvetica, Arial, sans-serif;
    --body: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ground-soft); color: var(--ink);
    font: 16px/1.6 var(--body); padding: 24px;
  }
  .card {
    background: var(--ground); border: 1px solid var(--rule); border-radius: 6px;
    padding: 44px 40px; width: 100%; max-width: 430px;
    box-shadow: 0 1px 3px rgba(20, 38, 46, .06);
  }
  .rule { height: 3px; background: var(--accent); border-radius: 2px; width: 46px; margin-bottom: 22px; }
  h1 { font-family: var(--head); font-size: 21px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 28px; color: var(--muted); font-size: 14.5px; }
  p { margin: 0 0 14px; }
  button[type=submit], a.btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font-family: var(--head); font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--link); color: #fff; border: 1px solid var(--link);
    border-radius: 4px; padding: 13px 18px;
  }
  button[type=submit]:hover, a.btn:hover { background: var(--link-hover); border-color: var(--link-hover); }
  button[type=submit]:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .note {
    margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 13.5px;
  }
  .note strong { color: var(--ink); }
  code { background: var(--ground-soft); padding: 1px 5px; border-radius: 3px; font-size: 12.5px; }
  a { color: var(--link); }
  form.plain input { width: 100%; padding: 11px; margin-bottom: 10px; border: 1px solid var(--rule); border-radius: 4px; font: inherit; }
  form.plain label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .errorlist { color: #a4262c; font-size: 14px; padding-left: 18px; margin: 0 0 14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="rule"></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
